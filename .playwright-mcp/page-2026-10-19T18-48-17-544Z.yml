          - paragraph [ref=f5e513]: Eligible passages contain at least five words. Exact-word coverage is the number of words in passages with an exact match divided by all words in the analyzed passages. Approximate-only coverage uses the same denominator and counts words in passages with an approximate match but no exact match; it is reported separately and is not added to exact-word coverage. Approximate matches require word-set Jaccard overlap of at least 0.78. Exact matching uses Unicode NFKC, case-folding, and whitespace normalization. At most 300 passages from the selected document are analyzed. Local comparison includes all other owned documents with extracted text, but is limited to the first 1,000 source sentences per document; reports disclose when a document was truncated. Online search, when explicitly enabled, searches at most four distinctive passages.
          - paragraph [ref=f5e514]: Text similarity does not by itself prove plagiarism. Review the matching passages and sources manually.
